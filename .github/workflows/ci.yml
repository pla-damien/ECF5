name: CI

on:
  push:
  pull_request:

jobs:

  # ── Lint : vérifie le style et le formatage du code ──────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lint-${{ hashFiles('pyproject.toml') }}

      - run: pip install ruff

      - name: Vérification du style (ruff check)
        run: ruff check .

      - name: Vérification du formatage (ruff format)
        run: ruff format --check .

  # ── Typecheck : vérifie les types Python avec mypy ───────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: typecheck-${{ hashFiles('pyproject.toml') }}

      - run: pip install ".[dev]"

      - name: Vérification des types (mypy)
        run: mypy churnguard/

  # ── Test : exécute pytest avec couverture minimale de 70 % ───────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: test-${{ hashFiles('pyproject.toml') }}

      - run: pip install ".[dev]"

      - name: Tests et couverture (pytest)
        run: pytest --cov=churnguard --cov-fail-under=70

  # ── Build : construit l'image Docker et scanne les vulnérabilités ────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t churnguard:ci .

      - name: Scan de sécurité Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: churnguard:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
