name: Release

on:
  push:
    tags:
      - "v*.*.*"   # déclenché sur : git tag v1.0.0 && git push --tags

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # pour créer la release GitHub
      packages: write    # pour pousser vers ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Login vers ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées Docker (tag de version)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build et push vers ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Créer la release GitHub avec notes automatiques
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
